<!doctype html>
<html manifest="psunikit.appcache?v=1">
  <head>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #131416;
        color: #c1c2c5;
        font-family: 'Lucida Console', 'Courier New', 'Menlo';
      }

      /* ── Экран кэша ───────────────────────────────────────────────── */
      #cache-screen {
        display: none;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 32px 24px;
        -webkit-flex-direction: column;
        flex-direction: column;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
      }
      #cache-screen.visible {
        display: -webkit-flex;
        display: flex;
      }
      #cache-title {
        font-size: 13px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #74c0fc;
        margin-bottom: 20px;
        text-align: center;
      }
      #cache-bar-wrap {
        width: 100%;
        max-width: 460px;
        height: 22px;
        background: rgba(255,255,255,0.06);
        border-radius: 11px;
        border: 1px solid rgba(180,185,205,0.15);
        overflow: hidden;
        position: relative;
        margin-bottom: 12px;
      }
      #cache-bar-fill {
        height: 100%;
        width: 0%;
        background: -webkit-linear-gradient(left, #1e3a6e, #4f9cff);
        background: linear-gradient(90deg, #1e3a6e, #4f9cff);
        border-radius: 11px;
        -webkit-transition: width 0.3s ease;
        transition: width 0.3s ease;
      }
      #cache-bar-fill.done {
        background: -webkit-linear-gradient(left, #1a6b3a, #51cf66);
        background: linear-gradient(90deg, #1a6b3a, #51cf66);
      }
      #cache-bar-label {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: -webkit-flex;
        display: flex;
        -webkit-align-items: center;
        align-items: center;
        -webkit-justify-content: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #c8deff;
        pointer-events: none;
      }
      #cache-bar-label.done {
        color: #0a2a14;
      }
      #cache-status {
        font-size: 12px;
        letter-spacing: 1px;
        color: #9296a4;
        text-align: center;
        margin-top: 6px;
        min-height: 1.4em;
      }
      #cache-status.ready {
        color: #51cf66;
        font-size: 13px;
        letter-spacing: 2px;
      }
      #cache-status.error {
        color: #ff6b6b;
      }

      /* ── Консоль эксплойта ────────────────────────────────────────── */
      #console {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 20px;
        font-size: 12px;
        overflow: auto;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        font-family: 'Lucida Console', 'Courier New', 'Menlo';
        background-color: #131416;
        color: #c1c2c5;
      }
    </style>
    <title>Wobkot</title>
  </head>
  <body>

    <!-- Экран кэша (показывается при первой загрузке) -->
    <div id="cache-screen">
      <div id="cache-title">PSUniKit — Кэширование</div>
      <div id="cache-bar-wrap">
        <div id="cache-bar-fill"></div>
        <div id="cache-bar-label">0%</div>
      </div>
      <div id="cache-status">Загрузка...</div>
    </div>

    <!-- Консоль эксплойта (показывается при офлайн-запуске) -->
    <pre id="console"></pre>

    <script>
    (function() {
      var cache = window.applicationCache;
      if (!cache) return; // браузер не поддерживает AppCache

      var screen  = document.getElementById('cache-screen');
      var fill    = document.getElementById('cache-bar-fill');
      var label   = document.getElementById('cache-bar-label');
      var status  = document.getElementById('cache-status');
      var mainScript = document.getElementById('main-script');

      function showCacheScreen() {
        screen.className = 'visible';
        // Скрыть консоль (она нужна только для эксплойта)
        document.getElementById('console').style.display = 'none';
      }

      function setProgress(pct) {
        fill.style.width = pct + '%';
        label.textContent = pct + '%';
        if (pct >= 100) {
          fill.className = 'done';
          label.className = 'done';
        }
      }

      // Уже закэшировано → грузим эксплойт напрямую
      if (cache.status === cache.IDLE || cache.status === cache.OBSOLETE) {
        loadMainScript();
        return;
      }

      // Идёт кэширование → показываем прогресс
      showCacheScreen();
      status.textContent = 'Скачивание файлов...';

      cache.addEventListener('progress', function(e) {
        if (e.lengthComputable && e.total > 0) {
          setProgress(Math.round(e.loaded / e.total * 100));
        } else {
          setProgress(Math.min(99, (e.loaded || 1) * 7));
        }
      });

      cache.addEventListener('cached', function() {
        setProgress(100);
        status.className = 'ready';
        status.textContent = 'Кэш установлен — отключите интернет и перезапустите консоль';
      });

      cache.addEventListener('noupdate', function() {
        // Кэш актуален → запускаем эксплойт
        screen.className = '';
        document.getElementById('console').style.display = '';
        loadMainScript();
      });

      cache.addEventListener('updateready', function() {
        cache.swapCache();
        screen.className = '';
        document.getElementById('console').style.display = '';
        loadMainScript();
      });

      cache.addEventListener('error', function() {
        if (cache.status === cache.IDLE || cache.status === cache.OBSOLETE) {
          // Офлайн, кэш есть → запускаем
          screen.className = '';
          document.getElementById('console').style.display = '';
          loadMainScript();
        } else {
          showCacheScreen();
          setProgress(0);
          fill.className = '';
          label.className = '';
          status.className = 'error';
          status.textContent = 'Ошибка кэша — очистите данные браузера и перезапустите';
        }
      });

      function loadMainScript() {
        var s = document.createElement('script');
        s.src = 'src/main.js';
        s.defer = true;
        document.head.appendChild(s);
      }
    })();
    </script>
  </body>
</html>
